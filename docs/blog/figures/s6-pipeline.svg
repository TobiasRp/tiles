<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-label="From checkpoint to one launch">
<title>From checkpoint to one launch</title>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="24.0" y="32.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">From checkpoint to one launch</text>
<text x="24.0" y="54.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">Python plans once per model and GPU, offline; C++/CUDA executes the plan per request and makes no scheduling decision</text>
<defs><marker id="ah" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#52514e"/></marker></defs>
<rect x="24.0" y="104.0" width="130.0" height="128.0" rx="6" fill="#fdf3dc" stroke="#eda100" stroke-width="1.5"/>
<text x="89.0" y="124.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">checkpoint</text>
<text x="89.0" y="139.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">Llama 3.2 1B</text>
<text x="89.0" y="154.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">2.47 GB BF16</text>
<text x="89.0" y="169.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">rev 4e20de3</text>
<line x1="155.0" y1="168.0" x2="170.0" y2="168.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="171.0" y="104.0" width="130.0" height="128.0" rx="6" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="236.0" y="124.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">tileplan probe</text>
<text x="236.0" y="139.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">the compiled worker:</text>
<text x="236.0" y="154.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">1 block/SM × 1024</text>
<text x="236.0" y="169.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">64 registers</text>
<text x="236.0" y="184.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">20 workers</text>
<line x1="302.0" y1="168.0" x2="317.0" y2="168.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="318.0" y="104.0" width="130.0" height="128.0" rx="6" fill="#e8f1fc" stroke="#2a78d6" stroke-width="1.5"/>
<text x="383.0" y="124.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">tileplan import</text>
<text x="383.0" y="139.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">1,852 tile tasks</text>
<text x="383.0" y="154.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">in 99 waves,</text>
<text x="383.0" y="169.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">each on a fixed</text>
<text x="383.0" y="184.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">worker; validated</text>
<line x1="449.0" y1="168.0" x2="464.0" y2="168.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="465.0" y="104.0" width="130.0" height="128.0" rx="6" fill="#fcfcfb" stroke="#c9c8c2" stroke-width="1.5"/>
<text x="530.0" y="124.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">package</text>
<text x="530.0" y="139.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">plan.json (v10)</text>
<text x="530.0" y="154.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">weights.bin</text>
<text x="530.0" y="169.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">target.json</text>
<text x="530.0" y="184.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">context ≤ 4,096</text>
<line x1="596.0" y1="168.0" x2="611.0" y2="168.0" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="612.0" y="104.0" width="130.0" height="128.0" rx="6" fill="#fdeee7" stroke="#eb6834" stroke-width="1.5"/>
<text x="677.0" y="124.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="600">tile_runtime</text>
<text x="677.0" y="139.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">loads, re-validates,</text>
<text x="677.0" y="154.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">1 cooperative launch</text>
<text x="677.0" y="169.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">per ≤ 64 tokens</text>
<text x="677.0" y="184.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="middle" font-weight="400">20 instruction streams</text>
<path d="M24,258 v8 H524.0 v-8" fill="none" stroke="#52514e" stroke-width="1"/>
<text x="274.0" y="284.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400">Python, offline: probe, plan, validate, pack</text>
<path d="M536.0,258 v8 H736 v-8" fill="none" stroke="#52514e" stroke-width="1"/>
<text x="636.0" y="284.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11.5" fill="#52514e" text-anchor="middle" font-weight="400">C++/CUDA, online</text>
<text x="24.0" y="314.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">The probe queries the occupancy of the actual worker binary; the plan records its fingerprint, and the runtime rejects any other worker.</text>
</svg>
