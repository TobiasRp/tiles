<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-label="What the RTX 3050 asks of the design">
<title>What the RTX 3050 asks of the design</title>
<rect width="100%" height="100%" fill="#fcfcfb"/>
<text x="24.0" y="32.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">What the RTX 3050 asks of the design</text>
<text x="24.0" y="54.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">NVIDIA GeForce RTX 3050, 20 SMs, 1.5 MB L2, compute capability 8.6</text>
<text x="24.0" y="78.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">GEMV bandwidth against active workers</text>
<line x1="56" x2="420" y1="330.0" y2="330.0" stroke="#e6e5e1"/>
<text x="48.0" y="334.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">0</text>
<line x1="56" x2="420" y1="270.5" y2="270.5" stroke="#e6e5e1"/>
<text x="48.0" y="274.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">60</text>
<line x1="56" x2="420" y1="211.0" y2="211.0" stroke="#e6e5e1"/>
<text x="48.0" y="215.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">120</text>
<line x1="56" x2="420" y1="151.5" y2="151.5" stroke="#e6e5e1"/>
<text x="48.0" y="155.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">180</text>
<line x1="56" x2="420" y1="92.0" y2="92.0" stroke="#e6e5e1"/>
<text x="48.0" y="96.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">240</text>
<text x="56.0" y="346.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">1</text>
<text x="113.5" y="346.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">4</text>
<text x="190.1" y="346.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">8</text>
<text x="266.7" y="346.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">12</text>
<text x="343.4" y="346.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">16</text>
<text x="420.0" y="346.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">20</text>
<text x="238.0" y="364.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="middle" font-weight="400">workers, one per SM (GB/s)</text>
<line x1="56" x2="420" y1="118.8" y2="118.8" stroke="#c9c8c2" stroke-width="2" stroke-dasharray="2 4"/>
<text x="420.0" y="112.8" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" fill="#52514e" text-anchor="end" font-weight="400">stream roofline 213</text>
<polyline points="56.0,300.9 75.2,272.0 94.3,243.6 113.5,214.9 132.6,187.3 151.8,159.5 170.9,138.4 190.1,129.9 209.3,131.0 228.4,128.1 247.6,127.5 266.7,127.1 285.9,127.2 305.1,126.4 324.2,127.4 343.4,126.1 362.5,126.4 381.7,126.2 400.8,127.2 420.0,126.5" fill="none" stroke="#2a78d6" stroke-width="2.5"/>
<circle cx="56.0" cy="300.9" r="3" fill="#2a78d6"><title>1 workers: 29 GB/s</title></circle>
<circle cx="75.2" cy="272.0" r="3" fill="#2a78d6"><title>2 workers: 58 GB/s</title></circle>
<circle cx="94.3" cy="243.6" r="3" fill="#2a78d6"><title>3 workers: 87 GB/s</title></circle>
<circle cx="113.5" cy="214.9" r="3" fill="#2a78d6"><title>4 workers: 116 GB/s</title></circle>
<circle cx="132.6" cy="187.3" r="3" fill="#2a78d6"><title>5 workers: 144 GB/s</title></circle>
<circle cx="151.8" cy="159.5" r="3" fill="#2a78d6"><title>6 workers: 172 GB/s</title></circle>
<circle cx="170.9" cy="138.4" r="3" fill="#2a78d6"><title>7 workers: 193 GB/s</title></circle>
<circle cx="190.1" cy="129.9" r="3" fill="#2a78d6"><title>8 workers: 202 GB/s</title></circle>
<circle cx="209.3" cy="131.0" r="3" fill="#2a78d6"><title>9 workers: 201 GB/s</title></circle>
<circle cx="228.4" cy="128.1" r="3" fill="#2a78d6"><title>10 workers: 204 GB/s</title></circle>
<circle cx="247.6" cy="127.5" r="3" fill="#2a78d6"><title>11 workers: 204 GB/s</title></circle>
<circle cx="266.7" cy="127.1" r="3" fill="#2a78d6"><title>12 workers: 205 GB/s</title></circle>
<circle cx="285.9" cy="127.2" r="3" fill="#2a78d6"><title>13 workers: 205 GB/s</title></circle>
<circle cx="305.1" cy="126.4" r="3" fill="#2a78d6"><title>14 workers: 205 GB/s</title></circle>
<circle cx="324.2" cy="127.4" r="3" fill="#2a78d6"><title>15 workers: 204 GB/s</title></circle>
<circle cx="343.4" cy="126.1" r="3" fill="#2a78d6"><title>16 workers: 206 GB/s</title></circle>
<circle cx="362.5" cy="126.4" r="3" fill="#2a78d6"><title>17 workers: 205 GB/s</title></circle>
<circle cx="381.7" cy="126.2" r="3" fill="#2a78d6"><title>18 workers: 206 GB/s</title></circle>
<circle cx="400.8" cy="127.2" r="3" fill="#2a78d6"><title>19 workers: 205 GB/s</title></circle>
<circle cx="420.0" cy="126.5" r="3" fill="#2a78d6"><title>20 workers: 205 GB/s</title></circle>
<text x="196.1" y="151.9" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">8 workers: 202 GB/s</text>
<text x="460.0" y="102.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Bandwidth, not compute</text>
<text x="460.0" y="117.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">213 GB/s floors a token at 11.6 ms;</text>
<text x="460.0" y="131.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">8 SMs already stream 202 GB/s</text>
<text x="460.0" y="155.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">One block per SM</text>
<text x="460.0" y="170.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">1024 threads, 64 registers,</text>
<text x="460.0" y="184.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">23.4 KB static shared memory (probed)</text>
<text x="460.0" y="208.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Cheap grid barriers</text>
<text x="460.0" y="223.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">0.76 µs each (cooperative launch);</text>
<text x="460.0" y="237.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">99 per token</text>
<text x="460.0" y="261.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">No cache to hide in</text>
<text x="460.0" y="276.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">1.5 MB L2 against 122 MB</text>
<text x="460.0" y="290.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">of weights per layer</text>
<text x="460.0" y="314.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">No TMA, no PDL</text>
<text x="460.0" y="329.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">plain loads; a shared-memory prefetch</text>
<text x="460.0" y="343.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">ring was probed (S3): ≤ 0.1 ms, not built</text>
<text x="460.0" y="367.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">A display watchdog</text>
<text x="460.0" y="382.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">kills long kernels: ≤ 64 tokens</text>
<text x="460.0" y="396.0" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">per launch</text>
</svg>
